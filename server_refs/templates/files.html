<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebHandGuidance Data Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 960px; margin: 0 auto; }
    h1 { margin-bottom: 0.5rem; }
    #status { margin: 0.5rem 0; font-size: 0.9rem; color: #555; }
    label { font-size: 0.9rem; }
    input[type=password] { padding: 0.3rem 0.4rem; font-size: 0.9rem; }
    button { padding: 0.35rem 0.7rem; font-size: 0.9rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; font-size: 0.9rem; }
    th { background: #f5f5f5; text-align: left; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #ececec; }
    th .sort-indicator { color: #888; margin-left: 0.25rem; font-size: 0.8rem; }
    a.button, button.button { display: inline-block; padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #333; text-decoration: none; font-size: 0.9rem; background: #fff; cursor: pointer; }
    button.button:disabled { color: #888; border-color: #aaa; cursor: not-allowed; }
    button.danger { border-color: #b00; color: #b00; }
    button.danger:hover:not(:disabled) { background: #fee; }
    #login { margin-top: 0.5rem; }
    #app { margin-top: 1rem; display: none; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    td.col-select, th.col-select { text-align: center; width: 2rem; }
  </style>
</head>
<body>
  <h1>WebHandGuidance Data Browser</h1>
  <div id="status"></div>
  <div id="login">
    <label>Password:
      <input type="password" id="password-input" />
    </label>
    <button id="login-button">Login</button>
  </div>
  <div id="app">
    <p class="actions">
      <button class="button" id="download-selected-button" disabled>Download selected</button>
      <button class="button danger" id="delete-selected-button" disabled>Delete selected</button>
      <button class="button" id="download-all-button">Download all</button>
      <span id="selected-count" style="font-size: 0.85rem; color: #555;"></span>
    </p>
    <table>
      <thead>
        <tr>
          <th class="col-select"><input type="checkbox" id="select-all" /></th>
          <th class="sortable" data-sort="name">Filename<span class="sort-indicator"></span></th>
          <th class="sortable" data-sort="size">Size<span class="sort-indicator"></span></th>
          <th class="sortable" data-sort="last_modified">Last modified<span class="sort-indicator"></span></th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="files-tbody">
      </tbody>
    </table>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const appEl = document.getElementById('app');
    const pwdInput = document.getElementById('password-input');
    const loginButton = document.getElementById('login-button');
    const filesTbody = document.getElementById('files-tbody');
    const downloadAllButton = document.getElementById('download-all-button');
    const downloadSelectedButton = document.getElementById('download-selected-button');
    const deleteSelectedButton = document.getElementById('delete-selected-button');
    const selectAllCheckbox = document.getElementById('select-all');
    const selectedCountEl = document.getElementById('selected-count');

    let allFiles = [];
    const selectedKeys = new Set();
    let sortKey = 'last_modified';
    let sortDir = 'desc';

    const MAX_LIST_PAGES = 100;
    const URL_BATCH_SIZE = 1000;
    const ZIP64_LIMIT = 0xffffffff;
    const encoder = new TextEncoder();

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    function getPassword() {
      return localStorage.getItem('whg_password') || '';
    }

    function setPassword(p) {
      localStorage.setItem('whg_password', p);
    }

    async function fetchWithAuth(path, options) {
      const password = getPassword();
      if (!password) throw new Error('No password set');
      const opts = options || {};
      opts.headers = opts.headers || {};
      opts.headers['Authorization'] = 'Bearer ' + password;
      const res = await fetch(path, opts);
      if (res.status === 403) {
        throw new Error('Forbidden');
      }
      return res;
    }

    function formatSize(bytes) {
      const n = Number(bytes);
      if (!isFinite(n) || n < 0) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
      return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function compareValues(a, b, key) {
      let av = a[key];
      let bv = b[key];
      if (key === 'size') {
        av = Number(av) || 0;
        bv = Number(bv) || 0;
        return av - bv;
      }
      av = String(av || '');
      bv = String(bv || '');
      return av.localeCompare(bv);
    }

    function updateSortIndicators() {
      document.querySelectorAll('th.sortable').forEach(th => {
        const ind = th.querySelector('.sort-indicator');
        if (th.dataset.sort === sortKey) {
          ind.textContent = sortDir === 'asc' ? '▲' : '▼';
        } else {
          ind.textContent = '';
        }
      });
    }

    function updateSelectionUI() {
      downloadSelectedButton.disabled = selectedKeys.size === 0;
      deleteSelectedButton.disabled = selectedKeys.size === 0;
      selectedCountEl.textContent = selectedKeys.size > 0 ? `${selectedKeys.size} selected` : '';
      const visibleKeys = allFiles.map(f => f.key);
      const allSelected = visibleKeys.length > 0 && visibleKeys.every(k => selectedKeys.has(k));
      const someSelected = visibleKeys.some(k => selectedKeys.has(k));
      selectAllCheckbox.checked = allSelected;
      selectAllCheckbox.indeterminate = !allSelected && someSelected;
    }

    function renderRows() {
      const sorted = allFiles.slice().sort((a, b) => {
        const c = compareValues(a, b, sortKey);
        return sortDir === 'asc' ? c : -c;
      });
      filesTbody.innerHTML = '';
      if (sorted.length === 0) {
        filesTbody.innerHTML = '<tr><td colspan="5">No files yet</td></tr>';
        updateSelectionUI();
        return;
      }
      for (const file of sorted) {
        const tr = document.createElement('tr');

        const tdSel = document.createElement('td');
        tdSel.className = 'col-select';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = selectedKeys.has(file.key);
        cb.addEventListener('change', () => {
          if (cb.checked) selectedKeys.add(file.key);
          else selectedKeys.delete(file.key);
          updateSelectionUI();
        });
        tdSel.appendChild(cb);
        tr.appendChild(tdSel);

        const tdName = document.createElement('td');
        tdName.textContent = file.name;
        tr.appendChild(tdName);

        const tdSize = document.createElement('td');
        tdSize.textContent = formatSize(file.size);
        tdSize.title = file.size + ' bytes';
        tr.appendChild(tdSize);

        const tdTime = document.createElement('td');
        tdTime.textContent = file.last_modified;
        tr.appendChild(tdTime);

        const tdAction = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = 'Download';
        btn.className = 'button';
        btn.addEventListener('click', async () => {
          try {
            const urlRes = await fetchWithAuth('/download-url?key=' + encodeURIComponent(file.key));
            if (!urlRes.ok) throw new Error('Error ' + urlRes.status);
            const j = await urlRes.json();
            if (j.url) {
              window.location.href = j.url;
            }
          } catch (e) {
            setStatus('Download error: ' + e.message);
          }
        });
        tdAction.appendChild(btn);
        tr.appendChild(tdAction);

        filesTbody.appendChild(tr);
      }
      updateSelectionUI();
      updateSortIndicators();
    }

    async function loadFiles() {
      setStatus('Loading files...');
      filesTbody.innerHTML = '';
      try {
        const collected = [];
        let token = null;
        let pages = 0;
        do {
          const query = token ? '?token=' + encodeURIComponent(token) : '';
          const res = await fetchWithAuth('/files-json' + query);
          if (!res.ok) {
            throw new Error('Error ' + res.status);
          }
          const data = await res.json();
          const batch = Array.isArray(data) ? data : (data.files || []);
          collected.push(...batch);
          token = Array.isArray(data) ? null : (data.nextToken || null);
          pages += 1;
          if (token) setStatus(`Loading files... ${collected.length} so far`);
        } while (token && pages < MAX_LIST_PAGES);

        allFiles = collected;
        const validKeys = new Set(allFiles.map(f => f.key));
        for (const k of Array.from(selectedKeys)) {
          if (!validKeys.has(k)) selectedKeys.delete(k);
        }
        renderRows();
        appEl.style.display = 'block';
        setStatus('Files loaded.');
      } catch (e) {
        appEl.style.display = 'none';
        setStatus('Error loading files: ' + e.message);
      }
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        table[i] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) {
        c = crcTable[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      }
      return (c ^ 0xffffffff) >>> 0;
    }

    function dosDateTime(date) {
      const year = Math.max(1980, date.getFullYear());
      return {
        time: ((date.getHours() & 31) << 11) | ((date.getMinutes() & 63) << 5) | ((date.getSeconds() >> 1) & 31),
        date: (((year - 1980) & 127) << 9) | (((date.getMonth() + 1) & 15) << 5) | (date.getDate() & 31),
      };
    }

    function byteWriter(size) {
      const bytes = new Uint8Array(size);
      const view = new DataView(bytes.buffer);
      let pos = 0;
      return {
        bytes,
        u16(v) { view.setUint16(pos, v, true); pos += 2; },
        u32(v) { view.setUint32(pos, v >>> 0, true); pos += 4; },
        u64(v) { view.setBigUint64(pos, BigInt(v), true); pos += 8; },
        raw(b) { bytes.set(b, pos); pos += b.length; },
      };
    }

    function localFileHeader(entry) {
      const zip64 = entry.size >= ZIP64_LIMIT;
      const extraLength = zip64 ? 20 : 0;
      const w = byteWriter(30 + entry.nameBytes.length + extraLength);
      w.u32(0x04034b50);
      w.u16(zip64 ? 45 : 20);
      w.u16(0x0800);
      w.u16(0);
      w.u16(entry.time);
      w.u16(entry.date);
      w.u32(entry.crc);
      w.u32(zip64 ? ZIP64_LIMIT : entry.size);
      w.u32(zip64 ? ZIP64_LIMIT : entry.size);
      w.u16(entry.nameBytes.length);
      w.u16(extraLength);
      w.raw(entry.nameBytes);
      if (zip64) {
        w.u16(0x0001);
        w.u16(16);
        w.u64(entry.size);
        w.u64(entry.size);
      }
      return w.bytes;
    }

    function centralDirectoryEntry(entry) {
      const bigSize = entry.size >= ZIP64_LIMIT;
      const bigOffset = entry.offset >= ZIP64_LIMIT;
      const extraLength = (bigSize || bigOffset) ? 4 + (bigSize ? 16 : 0) + (bigOffset ? 8 : 0) : 0;
      const w = byteWriter(46 + entry.nameBytes.length + extraLength);
      w.u32(0x02014b50);
      w.u16(extraLength ? 45 : 20);
      w.u16(extraLength ? 45 : 20);
      w.u16(0x0800);
      w.u16(0);
      w.u16(entry.time);
      w.u16(entry.date);
      w.u32(entry.crc);
      w.u32(bigSize ? ZIP64_LIMIT : entry.size);
      w.u32(bigSize ? ZIP64_LIMIT : entry.size);
      w.u16(entry.nameBytes.length);
      w.u16(extraLength);
      w.u16(0);
      w.u16(0);
      w.u16(0);
      w.u32(0);
      w.u32(bigOffset ? ZIP64_LIMIT : entry.offset);
      w.raw(entry.nameBytes);
      if (extraLength) {
        w.u16(0x0001);
        w.u16(extraLength - 4);
        if (bigSize) {
          w.u64(entry.size);
          w.u64(entry.size);
        }
        if (bigOffset) w.u64(entry.offset);
      }
      return w.bytes;
    }

    function endOfCentralDirectory(count, centralSize, centralOffset) {
      const zip64 = count >= 0xffff || centralSize >= ZIP64_LIMIT || centralOffset >= ZIP64_LIMIT;
      const w = byteWriter((zip64 ? 76 : 0) + 22);
      if (zip64) {
        w.u32(0x06064b50);
        w.u64(44);
        w.u16(45);
        w.u16(45);
        w.u32(0);
        w.u32(0);
        w.u64(count);
        w.u64(count);
        w.u64(centralSize);
        w.u64(centralOffset);
        w.u32(0x07064b50);
        w.u32(0);
        w.u64(centralOffset + centralSize);
        w.u32(1);
      }
      w.u32(0x06054b50);
      w.u16(0);
      w.u16(0);
      w.u16(zip64 ? 0xffff : count);
      w.u16(zip64 ? 0xffff : count);
      w.u32(zip64 ? ZIP64_LIMIT : centralSize);
      w.u32(zip64 ? ZIP64_LIMIT : centralOffset);
      w.u16(0);
      return w.bytes;
    }

    async function fetchDownloadUrls(keys) {
      const items = [];
      for (let i = 0; i < keys.length; i += URL_BATCH_SIZE) {
        const res = await fetchWithAuth('/download-urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keys: keys.slice(i, i + URL_BATCH_SIZE) }),
        });
        if (!res.ok) throw new Error('Error ' + res.status);
        const data = await res.json();
        items.push(...(data.urls || []));
      }
      return items;
    }

    async function fetchObjectBytes(url) {
      const opts = url.startsWith('/')
        ? { headers: { Authorization: 'Bearer ' + getPassword() } }
        : {};
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return new Uint8Array(await res.arrayBuffer());
    }

    async function streamZipToDisk(keys) {
      const stamp = new Date().toISOString().slice(0, 10);
      const handle = await window.showSaveFilePicker({
        suggestedName: `whg_data_${stamp}.zip`,
        types: [{ description: 'ZIP archive', accept: { 'application/zip': ['.zip'] } }],
      });

      setStatus('Requesting download URLs...');
      const items = await fetchDownloadUrls(keys);
      const modified = new Map(allFiles.map(f => [f.key, f.last_modified]));
      const writable = await handle.createWritable();
      const entries = [];
      let offset = 0;
      let failed = 0;

      try {
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          setStatus(`Archiving ${i + 1}/${items.length} — ${item.name}`);
          let bytes;
          try {
            bytes = await fetchObjectBytes(item.url);
          } catch (err) {
            console.warn('Skipping', item.key, err);
            failed += 1;
            continue;
          }
          const when = modified.get(item.key);
          const stamped = dosDateTime(when ? new Date(when) : new Date());
          const entry = {
            nameBytes: encoder.encode(item.name),
            size: bytes.length,
            crc: crc32(bytes),
            offset,
            time: stamped.time,
            date: stamped.date,
          };
          const header = localFileHeader(entry);
          await writable.write(header);
          await writable.write(bytes);
          offset += header.length + bytes.length;
          entries.push(entry);
        }

        const centralOffset = offset;
        let centralSize = 0;
        for (const entry of entries) {
          const record = centralDirectoryEntry(entry);
          await writable.write(record);
          centralSize += record.length;
        }
        await writable.write(endOfCentralDirectory(entries.length, centralSize, centralOffset));
      } finally {
        await writable.close();
      }

      let msg = `Archived ${entries.length} file(s).`;
      if (failed) msg += ` ${failed} failed and were skipped.`;
      setStatus(msg);
    }

    async function downloadIndividually(keys, reason) {
      const note = reason ? ` [zip unavailable — ${reason}]` : '';
      const total = keys.length;
      setStatus(`Starting ${total} download(s)...${note}`);
      let items;
      try {
        items = await fetchDownloadUrls(keys);
      } catch (e) {
        setStatus('Download error: ' + e.message);
        return;
      }
      let done = 0;
      for (const item of items) {
        const a = document.createElement('a');
        a.href = item.url;
        a.download = item.name;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        done += 1;
        setStatus(`Downloading ${done}/${total}...`);
        await new Promise(r => setTimeout(r, 250));
      }
      setStatus(`Started ${done}/${total} download(s).${note}`);
    }

    async function downloadKeys(keys) {
      if (keys.length === 0) return;
      let reason = '';
      if (!window.showSaveFilePicker) {
        reason = 'browser has no File System Access API';
      } else {
        try {
          await streamZipToDisk(keys);
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') {
            setStatus('Cancelled.');
            return;
          }
          console.warn('Zip download failed, falling back to individual files', e);
          reason = (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e));
        }
      }
      await downloadIndividually(keys, reason);
    }

    async function handleDownloadAll() {
      if (allFiles.length === 0) {
        setStatus('No files to download');
        return;
      }
      await downloadKeys(allFiles.map(f => f.key));
    }

    async function handleDownloadSelected() {
      await downloadKeys(Array.from(selectedKeys));
    }

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = key === 'last_modified' ? 'desc' : 'asc';
        }
        renderRows();
      });
    });

    selectAllCheckbox.addEventListener('change', () => {
      if (selectAllCheckbox.checked) {
        for (const f of allFiles) selectedKeys.add(f.key);
      } else {
        for (const f of allFiles) selectedKeys.delete(f.key);
      }
      renderRows();
    });

    loginButton.addEventListener('click', async () => {
      const pwd = pwdInput.value;
      if (!pwd) {
        setStatus('Enter a password');
        return;
      }
      setPassword(pwd);
      await loadFiles();
    });

    async function handleDeleteSelected() {
      const count = selectedKeys.size;
      if (count === 0) return;
      const ok = window.confirm(
        `Are you sure you want to delete ${count} file${count === 1 ? '' : 's'}? This action is irreversible.`
      );
      if (!ok) return;
      setStatus(`Deleting ${count} file(s)...`);
      try {
        const res = await fetchWithAuth('/delete-selected', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keys: Array.from(selectedKeys) }),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error('Error ' + res.status + ': ' + text);
        }
        const j = await res.json().catch(() => ({}));
        const movedCount = (j.moved || []).length;
        const skippedCount = (j.skipped || []).length;
        selectedKeys.clear();
        await loadFiles();
        let msg = `Moved ${movedCount} file(s) to trash.`;
        if (skippedCount) msg += ` Skipped ${skippedCount}.`;
        setStatus(msg);
      } catch (e) {
        setStatus('Delete error: ' + e.message);
      }
    }

    downloadAllButton.addEventListener('click', handleDownloadAll);
    downloadSelectedButton.addEventListener('click', handleDownloadSelected);
    deleteSelectedButton.addEventListener('click', handleDeleteSelected);

    window.addEventListener('DOMContentLoaded', async () => {
      updateSortIndicators();
      const saved = getPassword();
      if (saved) {
        pwdInput.value = saved;
        await loadFiles();
      }
    });
  </script>
</body>
</html>
