<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebHandGuidance Data Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 960px; margin: 0 auto; }
    h1 { margin-bottom: 0.5rem; }
    #status { margin: 0.5rem 0; font-size: 0.9rem; color: #555; }
    label { font-size: 0.9rem; }
    input[type=password] { padding: 0.3rem 0.4rem; font-size: 0.9rem; }
    button { padding: 0.35rem 0.7rem; font-size: 0.9rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; font-size: 0.9rem; }
    th { background: #f5f5f5; text-align: left; }
    a.button, button.button { display: inline-block; padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #333; text-decoration: none; font-size: 0.9rem; background: #fff; cursor: pointer; }
    #login { margin-top: 0.5rem; }
    #app { margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <h1>WebHandGuidance Data Browser</h1>
  <div id="status"></div>
  <div id="login">
    <label>Password:
      <input type="password" id="password-input" />
    </label>
    <button id="login-button">Login</button>
  </div>
  <div id="app">
    <p>
      <button class="button" id="download-all-button">Download all as ZIP</button>
    </p>
    <table>
      <thead>
        <tr>
          <th>Filename</th>
          <th>Size (bytes)</th>
          <th>Last modified</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="files-tbody">
      </tbody>
    </table>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const appEl = document.getElementById('app');
    const pwdInput = document.getElementById('password-input');
    const loginButton = document.getElementById('login-button');
    const filesTbody = document.getElementById('files-tbody');
    const downloadAllButton = document.getElementById('download-all-button');

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    function getPassword() {
      return localStorage.getItem('whg_password') || '';
    }

    function setPassword(p) {
      localStorage.setItem('whg_password', p);
    }

    async function fetchWithAuth(path, options) {
      const password = getPassword();
      if (!password) throw new Error('No password set');
      const opts = options || {};
      opts.headers = opts.headers || {};
      opts.headers['Authorization'] = 'Bearer ' + password;
      const res = await fetch(path, opts);
      if (res.status === 403) {
        throw new Error('Forbidden');
      }
      return res;
    }

    async function loadFiles() {
      setStatus('Loading files...');
      filesTbody.innerHTML = '';
      try {
        const res = await fetchWithAuth('/files-json');
        if (!res.ok) {
          throw new Error('Error ' + res.status);
        }
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          filesTbody.innerHTML = '<tr><td colspan="4">No files yet</td></tr>';
        } else {
          for (const file of data) {
            const tr = document.createElement('tr');

            const tdName = document.createElement('td');
            tdName.textContent = file.name;
            tr.appendChild(tdName);

            const tdSize = document.createElement('td');
            tdSize.textContent = file.size;
            tr.appendChild(tdSize);

            const tdTime = document.createElement('td');
            tdTime.textContent = file.last_modified;
            tr.appendChild(tdTime);

            const tdAction = document.createElement('td');
            const btn = document.createElement('button');
            btn.textContent = 'Download';
            btn.className = 'button';
            btn.addEventListener('click', async () => {
              try {
                const urlRes = await fetchWithAuth('/download-url?key=' + encodeURIComponent(file.key));
                if (!urlRes.ok) throw new Error('Error ' + urlRes.status);
                const j = await urlRes.json();
                if (j.url) {
                  window.location.href = j.url;
                }
              } catch (e) {
                setStatus('Download error: ' + e.message);
              }
            });
            tdAction.appendChild(btn);
            tr.appendChild(tdAction);

            filesTbody.appendChild(tr);
          }
        }
        appEl.style.display = 'block';
        setStatus('Files loaded.');
      } catch (e) {
        appEl.style.display = 'none';
        setStatus('Error loading files: ' + e.message);
      }
    }

    async function handleDownloadAll() {
      setStatus('Preparing ZIP...');
      try {
        const res = await fetchWithAuth('/download-all');
        if (!res.ok) {
          const text = await res.text();
          throw new Error('Error ' + res.status + ': ' + text);
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'all_data.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        setStatus('Downloaded all_data.zip');
      } catch (e) {
        setStatus('Download-all error: ' + e.message);
      }
    }

    loginButton.addEventListener('click', async () => {
      const pwd = pwdInput.value;
      if (!pwd) {
        setStatus('Enter a password');
        return;
      }
      setPassword(pwd);
      await loadFiles();
    });

    downloadAllButton.addEventListener('click', handleDownloadAll);

    window.addEventListener('DOMContentLoaded', async () => {
      const saved = getPassword();
      if (saved) {
        pwdInput.value = saved;
        await loadFiles();
      }
    });
  </script>
</body>
</html>
